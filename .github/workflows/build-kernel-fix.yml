name: Build Kernel with Eureka Script

on:
  workflow_dispatch:
    inputs:
      kernelsu_choice:
        description: 'Choose which KernelSU version to install'
        required: true
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'RKSU'
        default: 'KernelSU-Next'
      kernelsu_next_version:
        description: 'Enter KernelSU-Next version (e.g., v1.0.9). Leave blank for latest.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      # Fixed KERNEL_DEFCONFIG for Samsung Galaxy A10
      KERNEL_DEFCONFIG: "OLD_exynos7885-a10_defconfig"
      
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 100

    - name: Initialize submodules
      run: git submodule update --init --recursive

    - name: Setup KernelSU
      run: |
        # Remove any existing KernelSU setup
        rm -rf KernelSU-Next KernelSU drivers/kernelsu
        
        # Check the user's choice and install the corresponding version
        if [ "${{ github.event.inputs.kernelsu_choice }}" == "KernelSU-Next" ]; then
          version="${{ github.event.inputs.kernelsu_next_version }}"
          # Use a default version if the user left the input blank
          if [ -z "$version" ]; then
            echo "No version specified for KernelSU-Next. Using default: v1.0.9"
            version="v1.0.9"
          else
            echo "Installing KernelSU-Next version: $version"
          fi
          
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$version"
          
        elif [ "${{ github.event.inputs.kernelsu_choice }}" == "SukiSU-Ultra" ]; then
          echo "Installing SukiSU-Ultra..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki
        
        elif [ "${{ github.event.inputs.kernelsu_choice }}" == "RKSU" ]; then
          echo "Installing RKSU..."
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main
          
        else
          echo "Invalid choice. Please choose one of the available options."
          exit 1
        fi
        
        # Verify installation
        ls -la drivers/kernelsu/
        ls -la drivers/kernelsu/Kconfig || echo "Kconfig not found"

      
          # Cleanup
          rm -rf ./kernelsu-coccinelle/
      
          # Delete files that may conflict with kernel functionality
          rm -rf ./android/abi_gki_protected_exports*

    - name: Cache proton-clang
      uses: actions/cache@v3
      id: cache-proton
      with:
        path: proton-clang
        key: proton-clang-${{ runner.os }}-${{ hashFiles('**/build-kernel.yml') }}
        restore-keys: |
          proton-clang-${{ runner.os }}-

    - name: Cache APT packages
      uses: actions/cache@v3
      with:
        path: /var/cache/apt/archives
        key: apt-cache-${{ runner.os }}-${{ hashFiles('**/build-kernel.yml') }}
        restore-keys: |
          apt-cache-${{ runner.os }}-

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Install dependencies
      run: |
              # Check if ubuntu.sources file exists, otherwise use sources.list
                if [ -f "/etc/apt/sources.list.d/ubuntu.sources" ]; then
                  sudo cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources~
                  sudo sed -Ei 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
                else
                  sudo cp /etc/apt/sources.list /etc/apt/sources.list~
                  sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
                fi
              sudo apt-get update -y
              sudo apt install -y \
              gcc-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi \
              binutils make python3 python2 libssl-dev build-essential \
              bc bison flex unzip ca-certificates xz-utils \
              mkbootimg cpio device-tree-compiler git git-lfs
            
              # Only download proton-clang if not cached
              if [ "${{ steps.cache-proton.outputs.cache-hit }}" != 'true' ]; then
                rm -rf proton-clang
                git clone https://github.com/kdrag0n/proton-clang --depth=1 -b master
              fi

    # --- START OF COCICNELLE PATCHING AND CLEANUP ---
    - name: 'Patch kernel with Coccinelle hooks and clean'
      working-directory: '/home/runner/work/Eureka-Kernel/Eureka-Kernel/'
      run: |
        # Install coccinelle dependencies
        sudo apt-get build-dep -y coccinelle
        
        # Clone and install coccinelle from source
        git clone --depth=1 https://github.com/coccinelle/coccinelle.git
        cd ./coccinelle/
        ./autogen
        ./configure
        make -j$(nproc --all)
        sudo make -j$(nproc --all) install
        cd .. # Return to root directory

        # Clone the repository which contains the patch
        git clone --depth=1 https://github.com/devnoname120/kernelsu-coccinelle.git
        # Patch the kernel source with scope-minimized hooks
        for p in fs drivers/input drivers/tty arch/arm/kernel; do spatch --sp-file ./kernelsu-coccinelle/scope-minimized-hooks/kernelsu-scope-minimized.cocci --in-place --linux-spacing "$p"; done
        # Cleanup
        rm -rf ./kernelsu-coccinelle/
        # Delete files that may conflict with kernel functionality
        rm -rf ./android/abi_gki_protected_exports*
        
        # Run make clean/mrproper here, AFTER all patches have been applied
        make clean
        make mrproper
    # --- END OF COCICNELLE PATCHING AND CLEANUP ---


    - name: GetTime
      id: get_time
      run: |
        echo "TIME=$(TZ=UTC+7 date +%m%d%H%M)" >> $GITHUB_OUTPUT

    - name: Setup toolchain directory
      run: |
        # Create toolchain directory and link to proton-clang
        mkdir -p toolchain
        if [ -d "proton-clang" ]; then
          ln -sf ../proton-clang/bin toolchain/bin
          ln -sf ../proton-clang/lib toolchain/lib
        fi
        
        # Verify toolchain setup
        ls -la toolchain/
        ls -la proton-clang/bin/ | head -10

    - name: Run Eureka build script
      run: |
        chmod +x build.sh
        
        # Set comprehensive environment for CI build 
        export BUILD_NO=""
        export CORES=$(nproc --all)
        export TERM=xterm-256color
        export CI=true
        export DEBIAN_FRONTEND=noninteractive
        export SHELL=/bin/bash
        export COLUMNS=80
        export LINES=24
        
        echo "=== Starting Eureka build script ==="
        echo "Available cores: $CORES"
        echo "Current directory: $(pwd)"
        echo "Environment variables set for CI"
        echo "TERM=$TERM"
        echo "CI=$CI"
        
        # Show build_output.log content from previous run if exists
        if [ -f "build_output.log" ]; then
          echo "=== Previous build log found ==="
          tail -20 build_output.log
        fi
        
        # Run the patched script and capture all output
        echo "Running Eureka build script with patched values..."
        
        # Use script command to handle terminal emulation properly
        script -q -c "timeout 7200 bash -x build.sh" build_output.log || {
          exit_code=$?
          echo "Script execution completed with exit code $exit_code"
          
          # Show detailed error information
          echo "=== Last 200 lines of build output ==="
          tail -200 build_output.log 2>/dev/null || echo "No build output log found"
          
          # Continue to check for partial build results
        }
        
        echo "=== Build script execution completed ==="
        
        # Show the build output for debugging
        echo "=== Build output (last 100 lines) ==="
        tail -100 build_output.log 2>/dev/null || echo "No build output log found"
        
        # Check if build was successful by looking for output files
        echo "=== Checking build results ==="
        if [ -f "arch/arm64/boot/Image" ]; then
          echo "✓ Kernel Image found in arch/arm64/boot/"
          ls -la arch/arm64/boot/
        else
          echo "✗ No Kernel Image found in arch/arm64/boot/"
          ls -la arch/arm64/boot/ || echo "boot directory not found"
        fi
        
        if [ -f "kernel_zip/anykernel/Image" ]; then
          echo "✓ Image file found in kernel_zip/anykernel/"
        else
          echo "✗ No Image file found in kernel_zip/anykernel/"
          ls -la kernel_zip/anykernel/ || echo "anykernel directory not found"
        fi
        
        # Check out directory
        if [ -d "out" ]; then
          echo "✓ out directory exists"
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "No built files in out/"
        else
          echo "✗ out directory not found"
        fi
        
        # Show disk usage and memory for debugging
        echo "=== System resources after build ==="
        df -h
        free -h

    - name: Package kernel
      run: |
        echo "Packaging and preparing for upload..."
        if [ -d "kernel_zip/anykernel" ]; then
          echo "Kernel build completed successfully"
          ls -la kernel_zip/anykernel/
        else
          echo "Warning: kernel_zip/anykernel directory not found"
          find . -name "*.zip" -type f 2>/dev/null || echo "No zip files found"
        fi

    - name: Upload kernel to artifact
      uses: actions/upload-artifact@v4
      with:
        name: Eureka_Kernel_A10_R15_${{ github.run_number }}
        path: |
          kernel_zip/anykernel/
          kernel_zip/aroma/
          *.zip
        if-no-files-found: warn
